// settings.gradle — project-level Gradle settings

pluginManagement {
    repositories {
        google()            // Android Gradle Plugin lives here
        mavenCentral()      // Most libraries
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // FAIL_ON_PROJECT_REPOS forces all repos to be declared here (cleaner)
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }   // Required for MPAndroidChart
    }
}

rootProject.name = "TableOrder"
include ':app'
