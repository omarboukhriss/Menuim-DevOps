# gradle.properties — Gradle and Android build settings

# JVM memory for the Gradle daemon (increase if builds are slow)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of old Support Library
android.useAndroidX=true

# Non-transitive R classes reduce build time and avoid resource conflicts
android.nonTransitiveRClass=true
